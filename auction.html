<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Nexus Legends | eFootball Auction 2026</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.5.25/jspdf.plugin.autotable.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Rajdhani:wght@600;700&display=swap');
        :root { --ef-blue: #040d21; --ef-neon: #eaff00; --ef-cyan: #00e5ff; }
        body { font-family: 'Rajdhani', sans-serif; background: var(--ef-blue); color: white; overflow-x: hidden; }
        .nexus-glass { background: rgba(255, 255, 255, 0.03); backdrop-filter: blur(15px); border: 1px solid rgba(255,255,255,0.1); }
        .timer-bar { height: 4px; background: var(--ef-neon); transition: width 1s linear; box-shadow: 0 0 15px var(--ef-neon); }
        .ef-gradient-btn { background: linear-gradient(90deg, var(--ef-cyan), var(--ef-neon)); color: black; font-weight: 800; transition: 0.3s; }
        .ef-gradient-btn:hover { transform: scale(1.05); filter: brightness(1.1); }
        .player-card { background: linear-gradient(180deg, rgba(0,229,255,0.1), transparent); border: 2px solid var(--ef-cyan); border-radius: 20px; }
    </style>
</head>
<body class="min-h-screen">

    <!-- AUTH MODAL -->
    <div id="authModal" class="fixed inset-0 z-[100] flex items-center justify-center bg-black/90">
        <div class="nexus-glass p-10 rounded-[2rem] w-full max-w-md text-center border-b-4 border-yellow-400">
            <div id="step_choice">
                <h1 class="text-4xl font-black mb-2 tracking-tighter">NEXUS <span class="text-cyan-400">LEGENDS</span></h1>
                <p class="text-gray-400 text-xs mb-8 uppercase tracking-[0.3em]">eFootball Auction Hub</p>
                <button onclick="showStep('reg')" class="w-full ef-gradient-btn py-4 rounded-xl mb-4 uppercase">Sign Up to Enter</button>
                <div class="flex gap-2">
                    <button onclick="showStep('cap')" class="flex-1 bg-white/5 py-3 rounded-lg text-[10px] font-bold uppercase">Captain</button>
                    <button onclick="showStep('adm')" class="flex-1 bg-white/5 py-3 rounded-lg text-[10px] font-bold uppercase">Admin</button>
                </div>
            </div>

            <div id="step_reg" class="hidden space-y-4">
                <input id="reg_name" type="text" placeholder="Your Name" class="w-full bg-black/40 p-3 rounded border border-white/10">
                <input id="reg_email" type="email" placeholder="Email Address" class="w-full bg-black/40 p-3 rounded border border-white/10">
                <button onclick="register()" class="w-full ef-gradient-btn py-3 rounded-xl">SEND OTP</button>
            </div>

            <div id="step_otp" class="hidden space-y-4">
                <p class="text-cyan-400 font-bold">Check your email for the code</p>
                <input id="otp_input" type="text" placeholder="6-Digit OTP" class="w-full bg-black/40 p-4 rounded text-center text-2xl tracking-[10px]">
                <button onclick="verify()" class="w-full ef-gradient-btn py-3 rounded-xl">VERIFY & JOIN</button>
            </div>
        </div>
    </div>

    <!-- DASHBOARD -->
    <div id="dashboard" class="hidden">
        <nav class="nexus-glass p-5 px-10 flex justify-between items-center border-b border-white/5">
            <span class="text-2xl font-black">NEXUS <span class="text-cyan-400">LEGENDS</span></span>
            <div id="userTag" class="text-xs font-bold text-cyan-400 bg-cyan-400/10 px-4 py-2 rounded-full border border-cyan-400/20"></div>
        </nav>

        <main class="max-w-7xl mx-auto p-6 grid grid-cols-12 gap-6">
            <!-- Auction Block -->
            <div class="col-span-12 lg:col-span-8 space-y-6">
                <div class="nexus-glass rounded-[2rem] p-8 min-h-[400px] flex flex-col items-center justify-center relative overflow-hidden">
                    <div id="timerBar" class="timer-bar absolute top-0 left-0" style="width: 100%"></div>
                    <div id="auctionContent" class="w-full text-center">
                        <p class="text-gray-600 animate-pulse italic">Waiting for the next legend to be nominated...</p>
                    </div>
                </div>

                <!-- Admin: Add Player -->
                <div id="adminPanel" class="hidden nexus-glass p-6 rounded-2xl border border-white/10">
                    <h3 class="font-bold text-cyan-400 mb-4">NOMINATE PLAYER</h3>
                    <div class="grid grid-cols-4 gap-4">
                        <input id="pName" type="text" placeholder="Name" class="bg-black/40 p-2 rounded border border-white/5">
                        <input id="pStr" type="number" placeholder="OVR" class="bg-black/40 p-2 rounded border border-white/5">
                        <select id="pType" class="bg-black/40 p-2 rounded border border-white/5"><option>Epic</option><option>Showtime</option><option>Big Time</option></select>
                        <input id="pBase" type="number" placeholder="Base L" class="bg-black/40 p-2 rounded border border-white/5">
                    </div>
                    <button onclick="addPlayer()" class="w-full mt-4 bg-cyan-600 py-3 rounded-xl font-bold uppercase">Add to Pool</button>
                </div>

                <!-- Player Pool -->
                <div class="nexus-glass rounded-2xl overflow-hidden">
                    <table class="w-full text-left text-sm">
                        <thead class="bg-white/5 text-[10px] uppercase text-gray-500">
                            <tr><th class="p-4">Player</th><th class="p-4">OVR</th><th class="p-4">Type</th><th class="p-4">Status</th><th class="p-4 text-center">Action</th></tr>
                        </thead>
                        <tbody id="playerList" class="divide-y divide-white/5"></tbody>
                    </table>
                </div>
            </div>

            <!-- Side Sidebar -->
            <div class="col-span-12 lg:col-span-4 space-y-6">
                <div class="nexus-glass p-6 rounded-2xl">
                    <h3 class="font-bold text-yellow-400 mb-4">TEAM PURSES</h3>
                    <div id="teamList" class="space-y-3"></div>
                </div>

                <button onclick="exportPDF()" class="w-full bg-red-600/20 text-red-500 border border-red-500/30 py-3 rounded-xl font-bold">EXPORT REPORT</button>

                <div class="nexus-glass h-[400px] flex flex-col rounded-2xl overflow-hidden">
                    <div id="chatBox" class="flex-1 overflow-y-auto p-4 space-y-2 text-xs"></div>
                    <div class="p-3 bg-black/40 flex gap-2">
                        <input id="chatInput" type="text" placeholder="Chat message..." class="flex-1 bg-transparent border border-white/10 p-2 rounded outline-none" onkeypress="if(event.key==='Enter')sendChat()">
                        <button onclick="sendChat()" class="bg-cyan-500 text-black px-4 rounded font-bold">></button>
                    </div>
                </div>
            </div>
        </main>
    </div>

    <script>
        const socket = io(window.location.origin);
        let user = JSON.parse(localStorage.getItem('nexus_user'));
        let currentPlayers = [];

        function showStep(s) {
            document.getElementById('step_choice').classList.add('hidden');
            document.getElementById('step_reg').classList.add('hidden');
            document.getElementById('step_otp').classList.add('hidden');
            if(s === 'reg') document.getElementById('step_reg').classList.remove('hidden');
        }

        function register() {
            const email = document.getElementById('reg_email').value;
            localStorage.setItem('temp_email', email);
            socket.emit('register', { name: document.getElementById('reg_name').value, email });
        }

        function verify() {
            socket.emit('verifyOTP', { email: localStorage.getItem('temp_email'), otp: document.getElementById('otp_input').value });
        }

        socket.on('authStep', () => document.getElementById('step_otp').classList.remove('hidden'));
        socket.on('loginSuccess', d => { localStorage.setItem('nexus_user', JSON.stringify(d)); location.reload(); });

        socket.on('initialData', d => {
            currentPlayers = d.players;
            renderPlayers(d.players);
            renderTeams(d.teams);
            renderAuction(d.state);
            d.chats.forEach(addChat);
        });

        socket.on('timerUpdate', t => {
            document.getElementById('timerBar').style.width = (t / 60 * 100) + "%";
            if(document.getElementById('timerVal')) document.getElementById('timerVal').innerText = t + "s";
        });

        socket.on('updateAuction', renderAuction);
        socket.on('updatePlayers', renderPlayers);
        socket.on('updateTeams', renderTeams);
        socket.on('newMessage', addChat);

        function renderPlayers(data) {
            document.getElementById('playerList').innerHTML = data.map(p => `
                <tr class="hover:bg-white/5">
                    <td class="p-4 font-bold">${p.name}</td>
                    <td class="p-4 text-cyan-400">${p.strength}</td>
                    <td class="p-4 text-[10px] uppercase">${p.cardType}</td>
                    <td class="p-4 ${p.status==='Available'?'text-green-500':'text-red-500'}">${p.status}</td>
                    <td class="p-4 text-center">
                        ${user?.role==='admin' && p.status==='Available' ? `<button onclick="socket.emit('startAuction',{playerId:'${p._id}',baseValue:${p.baseValue}})" class="bg-cyan-500 text-black px-3 py-1 rounded font-bold text-[10px]">START</button>` : `<span class="text-[10px] text-gray-500">${p.soldTo || '-'}</span>`}
                        ${user?.role==='admin' ? `<button onclick="socket.emit('deletePlayer','${p._id}')" class="ml-2 text-red-500">×</button>` : ''}
                    </td>
                </tr>
            `).join('');
        }

        function renderTeams(data) {
            document.getElementById('teamList').innerHTML = data.map(t => `<div class="flex justify-between bg-white/5 p-3 rounded-lg border border-white/5"><span>${t.name}</span><span class="text-cyan-400 font-bold">${t.budget}L</span></div>`).join('');
        }

        function renderAuction(s) {
            const box = document.getElementById('auctionContent');
            if(!s || !s.activePlayerId) { box.innerHTML = `<p class="text-gray-600 animate-pulse italic">Waiting for Next Legend...</p>`; return; }
            const p = s.activePlayerId;
            box.innerHTML = `
                <div class="player-card p-8 inline-block w-full max-w-sm">
                    <div id="timerVal" class="text-5xl font-black text-cyan-400 mb-4">60s</div>
                    <h2 class="text-4xl font-black uppercase italic">${p.name}</h2>
                    <p class="text-gray-400 tracking-widest mb-6">${p.cardType} | ${p.strength} OVR</p>
                    <div class="bg-black/60 p-6 rounded-2xl border border-cyan-400/20 mb-6">
                        <p class="text-xs uppercase text-gray-500">Current Bid</p>
                        <p class="text-6xl font-black text-white">${s.currentBid}L</p>
                        <p class="text-cyan-400 font-bold uppercase mt-2">${s.highestBidder || 'OPENING'}</p>
                    </div>
                    ${user?.role==='captain' ? `
                        <div class="flex gap-2 justify-center">
                            <button onclick="socket.emit('placeBid',{teamName:'${user.name}',increment:1})" class="bg-cyan-500 text-black px-6 py-2 rounded-xl font-bold">+1L</button>
                            <button onclick="socket.emit('placeBid',{teamName:'${user.name}',increment:5})" class="bg-cyan-500 text-black px-6 py-2 rounded-xl font-bold">+5L</button>
                        </div>
                    ` : ''}
                </div>
            `;
        }

        function sendChat() {
            const input = document.getElementById('chatInput');
            if(!input.value.trim() || !user) return;
            socket.emit('sendMessage', { sender: user.name, role: user.role, text: input.value });
            input.value = '';
        }

        function addChat(d) {
            const div = document.createElement('div');
            div.className = "p-2 bg-white/5 rounded-lg border border-white/5";
            div.innerHTML = `<span class="text-cyan-400 font-bold uppercase mr-2">${d.sender}:</span> ${d.text}`;
            document.getElementById('chatBox').appendChild(div);
            document.getElementById('chatBox').scrollTop = 99999;
        }

        function addPlayer() {
            socket.emit('addPlayer', { name: document.getElementById('pName').value, strength: document.getElementById('pStr').value, cardType: document.getElementById('pType').value, baseValue: document.getElementById('pBase').value });
        }

        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            doc.text("NEXUS LEGENDS AUCTION REPORT", 14, 20);
            doc.autoTable({ head: [['Player', 'OVR', 'Status']], body: currentPlayers.map(p=>[p.name, p.strength, p.soldTo || 'Available']) });
            doc.save('Nexus_Report.pdf');
        }

        if(user) {
            document.getElementById('authModal').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('userTag').innerText = `${user.name} | ${user.role}`;
            if(user.role === 'admin') document.getElementById('adminPanel').classList.remove('hidden');
        }
    </script>
</body>
</html>
